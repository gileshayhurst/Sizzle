services:
  - type: web
    name: sizzle-app
    runtime: docker
    dockerfilePath: ./Dockerfile.app
    plan: free
    envVars:
      - key: APP_MODE
        value: cloud
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GENERATOR_URL
        sync: false
      - key: ENCODER_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false

  - type: web
    name: sizzle-generator
    runtime: docker
    dockerfilePath: ./Dockerfile.generator
    plan: free
    envVars:
      - key: APP_MODE
        value: cloud
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      # Comma-separated frontend origin(s) allowed for cross-origin requests.
      # Leave unset to keep CORS permissive (e.g. local/dev).
      - key: ALLOWED_ORIGINS
        sync: false

  # Transcript encoder. Standalone (see encoder/README.md) — it can be moved to
  # another host without touching the two services above; the only contract is
  # the transcript file format.
  #
  # Sizing note: ONLY the audio fallback (POST /encode) loads a Whisper model.
  # The primary path (POST /encode/words) is pure text processing and needs no
  # model — it is lazy-loaded behind a double-checked lock — which is why the
  # free plan is viable here with the fallback off. `starter` is only needed to
  # actually SERVE the fallback for browsers that can't run the model.
  #
  # ENCODER_MODEL_SIZE=tiny is deliberate: measured on a real interview, tiny
  # anchors as many sentences as base (47/48), because the ASR is only an anchor
  # source. base costs more RAM and a slower cold start for no boundary gain.
  - type: web
    name: sizzle-encoder
    runtime: docker
    dockerfilePath: ./encoder/Dockerfile
    plan: free
    envVars:
      - key: ENCODER_MODEL_SIZE
        value: tiny
      # Disabled: the free plan's 512 MB cannot safely hold a Whisper model, and
      # an OOM would take the container down and interrupt other requests, where
      # a 503 fails only that caller — who keeps their plain transcript and still
      # gets a working reel. Set to 1 (and raise the plan) to serve browsers that
      # cannot run the model at all.
      - key: ENCODER_AUDIO_FALLBACK
        value: "0"
      - key: ALLOWED_ORIGINS
        sync: false
