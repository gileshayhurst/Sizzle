services:
  - type: web
    name: sizzle-app
    runtime: docker
    dockerfilePath: ./Dockerfile.app
    plan: free
    envVars:
      - key: APP_MODE
        value: cloud
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GENERATOR_URL
        sync: false
      # Launches the encoder one-off job (design doc D6). Without these,
      # /encode-session returns 503 and uploads keep plain transcripts.
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_ENCODER_SERVICE_ID
        sync: false
      - key: ENCODER_JOB_PLAN_ID
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false

  - type: web
    name: sizzle-generator
    runtime: docker
    dockerfilePath: ./Dockerfile.generator
    plan: free
    envVars:
      - key: APP_MODE
        value: cloud
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      # Comma-separated frontend origin(s) allowed for cross-origin requests.
      # Leave unset to keep CORS permissive (e.g. local/dev).
      - key: ALLOWED_ORIGINS
        sync: false

  # Transcript encoder. Standalone (see encoder/README.md) — it can be moved to
  # another host without touching the two services above; the only contract is
  # the transcript file format.
  #
  # This service has TWO roles:
  #   1. Serves POST /encode/words for the browser path (no model, no real CPU).
  #   2. Acts as the BASE SERVICE for bulk one-off jobs. Render one-off jobs
  #      inherit a base service's build artifact and env vars, so this is what
  #      gives `python -m encoder.job <session_key>` its image and credentials.
  #      Free plan is fine for both: the job requests its own instance size via
  #      planId and is billed per second only while running.
  #
  # ⚠️ `plan: starter` is REQUIRED, and not for capacity. Verified 2026-07-30:
  # Render refuses one-off jobs against a free-plan base service — "free tier
  # plans are not supported for jobs" — and a paid ENCODER_JOB_PLAN_ID does NOT
  # buy past it: a dispatch sending planId=plan-srv-014 was refused just the
  # same. Render checks the BASE SERVICE's plan, not the job's. So this service
  # must be paid purely in order to exist as a job target.
  #
  # It still does no work: the audio fallback is off and the primary endpoint
  # loads no model, so Starter's 512 MB is ample. The job requests its own,
  # larger instance via ENCODER_JOB_PLAN_ID and is billed per second while it
  # runs.
  #
  # The £0 alternative is to skip dispatch entirely and run
  # `python -m encoder.job sessions/<uuid>` locally against R2 — same code, no
  # paid plan. See encoder/README.md.
  #
  # ENCODER_MODEL_SIZE=tiny is deliberate: measured on a real interview, tiny
  # anchors as many sentences as base (47/48), because the ASR is only an anchor
  # source. base costs more RAM and a slower cold start for no boundary gain.
  - type: web
    name: sizzle-encoder
    runtime: docker
    dockerfilePath: ./encoder/Dockerfile
    plan: starter
    envVars:
      - key: ENCODER_MODEL_SIZE
        value: tiny
      # Disabled: the free plan's 512 MB cannot safely hold a Whisper model, and
      # an OOM would take the whole container down. Nothing calls POST /encode
      # since the browser ASR path was removed — it survives only as a manual
      # escape hatch, so leave it off unless you deliberately want it and have
      # raised the plan to suit.
      - key: ENCODER_AUDIO_FALLBACK
        value: "0"
      - key: ALLOWED_ORIGINS
        sync: false
      # ⚠️ REQUIRED BY THE ONE-OFF JOB, not by this web service.
      # A job inherits its base service's environment, and encoder/job.py reads
      # the session's videos and transcripts straight from R2. Without these the
      # job dies immediately on a missing-key error.
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
